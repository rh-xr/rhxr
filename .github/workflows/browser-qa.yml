name: RH-XR Browser QA — desktop and mobile
on:
  push:
    branches: [feature/rhxr-knowledge-ai-studio-v1]
    paths:
      - 'assets/js/**'
      - 'assets/css/**'
      - 'assets/models/**'
      - '*.html'
      - 'scripts/qa-browser.mjs'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install browser QA tools (CI only)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real desktop and mobile browser smoke tests
        run: node scripts/qa-browser.mjs
      - name: Store UI screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rhxr-desktop-mobile-screenshots
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 7
