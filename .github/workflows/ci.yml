name: RH-XR Lot 0 checks
on:
  push:
    branches: [main, 'feature/**', 'codex/**', 'design/**']
  pull_request:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          find assets/js scripts tests -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: npm test
